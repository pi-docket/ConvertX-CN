name: Auto Upstream Sync

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      force_sync:
        description: "即使沒有新提交，也產生審查報告；不自動合併或發布"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: upstream-commit-review
  cancel-in-progress: false

jobs:
  check-and-sync:
    name: Review upstream commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed checkpoint
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream main
        run: |
          git remote add upstream https://github.com/C4illin/ConvertX.git
          git fetch upstream main

      - name: Check commits since the reviewed checkpoint
        id: check
        run: bash scripts/check-upstream-commits.sh upstream/main upstream-sync.json >> "$GITHUB_OUTPUT"

      - name: Generate review report
        if: steps.check.outputs.has_updates == 'true' || inputs.force_sync
        env:
          REVIEW_BASE: ${{ steps.check.outputs.review_base }}
        run: |
          {
            printf '# 上游待審查提交\n\n'
            printf '檢查時間：%s\n\n' "$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            printf '已審查提交：`%s`\n\n' "$REVIEW_BASE"
            printf '上游目前提交：`%s`\n\n' "$(git rev-parse upstream/main)"
            printf '請逐項移植有益更新並執行回歸測試，保留中文介面、Lite 版、PDFMathTranslate 與安全措施。\n\n'
            printf '## 提交清單\n\n```text\n'
            git log --format='%H %s' "$REVIEW_BASE..upstream/main"
            printf '```\n\n## 變更統計\n\n```text\n'
            git diff --stat "$REVIEW_BASE..upstream/main"
            printf '```\n'
          } > upstream-review.md
          cat upstream-review.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save report for selective review
        if: steps.check.outputs.has_updates == 'true' || inputs.force_sync
        uses: actions/upload-artifact@v4
        with:
          name: upstream-commit-review
          path: upstream-review.md
          retention-days: 30

      - name: Summarize checkpoint
        if: always()
        env:
          REVIEW_BASE: ${{ steps.check.outputs.review_base }}
          COMMIT_COUNT: ${{ steps.check.outputs.commit_count }}
        run: |
          printf '\n已審查提交：`%s`；新增提交：%s。此工作流程只產生報告。\n' \
            "$REVIEW_BASE" "${COMMIT_COUNT:-檢查失敗}" >> "$GITHUB_STEP_SUMMARY"
